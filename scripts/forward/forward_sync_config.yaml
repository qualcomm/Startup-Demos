extends: "../common/common_config.yaml"

git_identity:
  name: "GitHub Forward Sync"
  email: "github-forward-sync@users.noreply.github.com"

execution:
  operation_timeout_seconds: 120
  dry_run_default: false

merge:
  message_template: "[forward-sync] Merge source changes into destination"
