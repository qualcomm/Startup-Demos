name: Peer-Review Check Signal

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Review event received; the trusted Peer-Review Check workflow will re-evaluate open PRs."