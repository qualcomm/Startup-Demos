name: Peer-Review Check Signal

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Save associated pull request number
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s\n' "$PULL_REQUEST_NUMBER" > "$RUNNER_TEMP/pull_request_number"
      - uses: actions/upload-artifact@v7
        with:
          name: review-signal-${{ github.run_id }}
          path: ${{ runner.temp }}/pull_request_number
          retention-days: 1