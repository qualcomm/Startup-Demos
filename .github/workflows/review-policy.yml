name: Peer-Review Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  merge_group:
    types: [checks_requested]
  workflow_run:
    workflows: [Peer-Review Check Signal]
    types: [completed]
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-policy
  queue: max

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.source.outputs.enabled }}
    steps:
      - id: source
        env:
          SOURCE_URL: ${{ secrets.SYNC_SOURCE_URL }}
        shell: bash
        run: |
          source_url=${SOURCE_URL%/}
          source_url=${source_url%.git}
          repository_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [[ "${source_url,,}" == "${repository_url,,}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    needs: source
    if: needs.source.outputs.enabled == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Download review signal
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: review-signal-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/review-signal
      - name: Validate review signal
        id: signal
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          number="$(< "$RUNNER_TEMP/review-signal/pull_request_number")"
          if [[ ! "$number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid pull request number in review signal artifact" >&2
            exit 1
          fi
          echo "pull_request_number=$number" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          MEMBERSHIP_TOKEN: ${{ secrets.SYNC_SOURCE_TOKEN }}
          SOURCE_BRANCH: ${{ secrets.SYNC_SOURCE_BRANCH || github.event.repository.default_branch }}
          CONTRIBUTORS_TEAM: contributors-startup-demos
          REVIEW_PR_NUMBER: ${{ steps.signal.outputs.pull_request_number || github.event.pull_request.number || '' }}
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const logPath = `${process.env.RUNNER_TEMP}/review-policy.log`;
            fs.writeFileSync(logPath, `Peer-Review Check diagnostics\nRun: ${context.runId}\nEvent: ${context.eventName}\n`);
            const writeLog = (level, message) => {
              const entry = `${new Date().toISOString()} [${level}] ${message}`;
              fs.appendFileSync(logPath, `${entry}\n`);
              core[level](message);
            };
            const diagnosticCore = {
              info: message => writeLog('info', message),
              error: message => writeLog('error', message),
              setFailed: message => {
                writeLog('error', `Workflow marked failed: ${message}`);
                core.setFailed(message);
              },
            };
            try {
            const branch = await github.rest.repos.getBranch({
              ...context.repo, branch: context.payload.repository.default_branch,
            });
            const load = async (path, dependencies = {}) => {
              const response = await github.rest.repos.getContent({
                ...context.repo, path, ref: branch.data.commit.sha,
              });
              const source = Buffer.from(response.data.content, 'base64').toString('utf8');
              const loaded = { exports: {} };
              const trustedRequire = name => {
                if (!(name in dependencies)) throw new Error(`Unexpected dependency: ${name}`);
                return dependencies[name];
              };
              new Function('module', 'require', source)(loaded, trustedRequire);
              return loaded.exports;
            };
            const checklist = await load('scripts/review-policy/checklist.cjs');
            const policy = await load('scripts/review-policy/policy.cjs', { './checklist.cjs': checklist });
            const instructions = await load('scripts/review-policy/instructions.cjs', { './checklist.cjs': checklist });
            const run = await load('scripts/review-policy/run.cjs', {
              './policy.cjs': policy, './instructions.cjs': instructions,
            });
            if (!process.env.MEMBERSHIP_TOKEN) {
              throw new Error('SYNC_SOURCE_TOKEN is required to read contributor membership');
            }
            const membership = new github.constructor({ auth: process.env.MEMBERSHIP_TOKEN });
            await run({ github, membership, context, core: diagnosticCore });
            } catch (error) {
              const details = JSON.stringify({
                name: error.name,
                message: error.message,
                status: error.status,
                request: error.request && { method: error.request.method, url: error.request.url },
                response: error.response && {
                  status: error.response.status,
                  data: error.response.data,
                  requestId: error.response.headers?.['x-github-request-id'],
                },
                cause: error.cause && { name: error.cause.name, message: error.cause.message, code: error.cause.code },
              });
              writeLog('error', `Evaluation script failed: ${details}`);
              throw error;
            }
      - name: Upload downloadable review-policy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-policy-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-policy.log
          if-no-files-found: warn
          retention-days: 7