name: Update README Tables

on:
  workflow_call:
    secrets:
      SYNC_SOURCE_TOKEN:
        required: true
    outputs:
      source_sha:
        description: Source commit including generated README changes
        value: ${{ jobs.update-readme.outputs.source_sha }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-readme:
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    runs-on: self-hosted
    defaults:
      run:
        working-directory: readme-worktree
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: readme-worktree
          fetch-depth: 0  # Full history for git log dates
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Run table update script
        run: python3 scripts/update-readme/update_readme_tables.py
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code README.md || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Generate commit message
        if: steps.git-check.outputs.changed == 'true'
        id: commit-msg
        run: |
          PROJECT_COUNT=$(find . -name "project.yaml" -path "*/[A-Z]*/*/*/project.yaml" | wc -l)
          DATE=$(date +"%Y-%m-%d")
          echo "message=docs(readme): update project tables - ${PROJECT_COUNT} projects (${DATE})" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        env:
          SYNC_SOURCE_TOKEN: ${{ secrets.SYNC_SOURCE_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PYTHONPATH: scripts
          COMMIT_MESSAGE: ${{ steps.commit-msg.outputs.message }}
        run: |
          python3 scripts/update-readme/update_readme.py \
            --config scripts/update-readme/update_readme_config.yaml \
            --branch "$GITHUB_REF_NAME" --message "$COMMIT_MESSAGE"

      - name: Record updated source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
