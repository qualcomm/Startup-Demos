name: Deploy to GitHub Pages

on:
  # Runs after Forward Sync in every hosting repo, whatever its outcome; the sync's source gate does not apply here.
  workflow_run:
    workflows: ["Forward Sync (source -> destination)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.probe.outputs.runner }}
    steps:
      - name: Select self-hosted or ubuntu-latest
        id: probe
        env:
          # Listing runners needs Administration: read, which GITHUB_TOKEN lacks.
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_URL: ${{ secrets.SYNC_SOURCE_URL }}
          PAGES_RUNNER: ${{ vars.PAGES_RUNNER }}
        shell: bash
        run: |
          if [[ -n "$PAGES_RUNNER" ]]; then
            if [[ "$PAGES_RUNNER" != "self-hosted" && "$PAGES_RUNNER" != "ubuntu-latest" ]]; then
              echo "::error::PAGES_RUNNER must be self-hosted or ubuntu-latest."
              exit 1
            fi
            echo "runner=$PAGES_RUNNER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$SOURCE_URL" ]]; then
            echo "Selected runner: ubuntu-latest (no source configuration required)"
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runner=""
          online=""
          if [[ -n "$RUNNER_STATUS_TOKEN" ]] && online=$(GH_TOKEN="$RUNNER_STATUS_TOKEN" gh api "repos/$REPOSITORY/actions/runners" \
              --jq '[.runners[] | select(.status == "online" and (.labels | map(.name) | index("self-hosted")))] | length' \
              2>/dev/null) && [[ "$online" =~ ^[0-9]+$ ]]; then
            echo "Online self-hosted runners: $online"
            if (( online > 0 )); then
              runner=self-hosted
            fi
          else
            online=""
            echo "Runner list unavailable."
          fi
          if [[ -z "$runner" ]]; then
            auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
            if ! timeout 30 git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --exit-code \
                "https://github.com/$REPOSITORY" HEAD >/dev/null 2>&1; then
              source_url=${SOURCE_URL%/}
              source_url=${source_url%.git}
              repository_url="$GITHUB_SERVER_URL/$REPOSITORY"
              if [[ -z "$online" && "${source_url,,}" == "${repository_url,,}" ]]; then
                runner=self-hosted
              else
                echo "::error::Hosted checkout is inaccessible and no usable self-hosted runner was found. Grant a runner access and set PAGES_RUNNER=self-hosted, or enable hosted repository access."
                exit 1
              fi
            fi
          fi
          runner=${runner:-ubuntu-latest}
          echo "Selected runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  deploy:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: pages-worktree
          fetch-depth: 0  # Full history for developer attribution
          persist-credentials: false

      - name: Build and deploy
        id: deploy
        uses: ./pages-worktree/.github/actions/deploy-pages
        with:
          artifact-name: github-pages
